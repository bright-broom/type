name: Autofix

# Autofix is intentionally manual. The trusted default-branch workflow prepares
# a read-only patch; a capability-separated writer applies it without executing
# pull-request code. Full CI remains a separate human action on the new SHA.
on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to fix
        required: true
        type: number
      expected_sha:
        description: Exact pull request head SHA to fix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: autofix-${{ inputs.pull_request_number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare mechanical patch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      head_ref: ${{ steps.pull-request.outputs.head_ref }}
    steps:
      - name: Verify the exact same-repository pull request
        id: pull-request
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.pull_request_number }}
        run: |
          read -r state head_repository current_sha head_ref author < <(
            gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" \
              --jq '[.state, .head.repo.full_name, .head.sha, .head.ref, .user.login] | @tsv'
          )
          if [ "$state" != open ]; then
            echo "::error::Pull request $NUMBER is not open."
            exit 1
          fi
          if [ "$head_repository" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Autofix accepts same-repository pull requests only."
            exit 1
          fi
          if [ "$current_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Pull request advanced from $EXPECTED_SHA to $current_sha."
            exit 1
          fi
          if [ "$author" = 'dependabot[bot]' ]; then
            echo "::error::Autofix does not modify Dependabot branches."
            exit 1
          fi
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact pull request commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Stop if the last commit is already an autofix
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -q '\[autofix\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: npm ci

      - name: Apply trusted mechanical commands
        if: steps.guard.outputs.skip == 'false'
        run: |
          npm run format
          npx eslint . --ignore-pattern dist --ignore-pattern .next --fix || true

      - name: Detect a patch
        id: diff
        if: steps.guard.outputs.skip == 'false'
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the mechanical result
        if: steps.diff.outputs.changed == 'true'
        run: npm run check:quick

      - name: Package only the patch
        if: steps.diff.outputs.changed == 'true'
        run: git diff --binary --full-index > autofix.patch

      - name: Upload the patch for the writer
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autofix-${{ inputs.pull_request_number }}-${{ inputs.expected_sha }}
          path: autofix.patch
          if-no-files-found: error
          retention-days: 1

  write:
    name: Apply verified mechanical patch
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted writer policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Confirm the pull request still points at the prepared commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.pull_request_number }}
        run: |
          read -r current state < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" \
            --jq '[.head.sha, .state] | @tsv')
          node trusted/scripts/autofix-contract.mjs head "$EXPECTED_SHA" "$current" "$state"

      - name: Checkout the exact pull request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          path: source

      - name: Download the prepared patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: autofix-${{ inputs.pull_request_number }}-${{ inputs.expected_sha }}
          path: artifact

      - name: Apply the patch without executing pull request code
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.pull_request_number }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files" \
            --jq 'map(.[]) | map(.filename)' > "$RUNNER_TEMP/pr-files.json"
          cd source
          git apply --index --whitespace=error ../artifact/autofix.patch
          git diff --cached --check
          test -z "$(git diff --cached --summary)"
          test -n "$(git diff --cached --name-only)"
          git diff --cached --name-status -z > "$RUNNER_TEMP/patch-name-status"
          node ../trusted/scripts/autofix-contract.mjs patch \
            "$RUNNER_TEMP/patch-name-status" "$RUNNER_TEMP/pr-files.json"

      - name: Commit and push the patch
        id: push
        working-directory: source
        env:
          BRANCH: ${{ needs.prepare.outputs.head_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.pull_request_number }}
        run: |
          read -r current state < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" \
            --jq '[.head.sha, .state] | @tsv')
          node ../trusted/scripts/autofix-contract.mjs head "$EXPECTED_SHA" "$current" "$state"
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --message 'style: [autofix] フォーマットとlintの自動修正を適用'
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Ask the owner to run Full CI on the new commit
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SHA: ${{ steps.push.outputs.sha }}
          NUMBER: ${{ inputs.pull_request_number }}
        run: |
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "機械修正を push しました。最新 Commit \`$NEW_SHA\` に対して Actions の Run workflow から Full CI を明示的に実行してください。"
