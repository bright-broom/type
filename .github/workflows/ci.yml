name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps:
    name: Dependency compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Runs before any install: an unsatisfiable peer range is exactly what makes
      # installing fail, so this must not depend on it succeeding.
      - name: Verify peer ranges are satisfiable
        run: npm run check:deps

  quality:
    name: Quality gates
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test with coverage thresholds
        run: npm run test:coverage
      - name: Detect dead code
        run: npm run check:dead-code
      - name: Build production application
        run: npm run build
      - name: Hold shipped JavaScript to its budget
        run: npm run check:bundle

  e2e:
    name: Browser E2E
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright system dependencies
        # Keep apt single-shot. Retrying after a timeout can overlap the original
        # apt process and fail on /var/lib/apt/lists/lock.
        timeout-minutes: 12
        run: timeout --signal=TERM --kill-after=30s 660s npx playwright install-deps chromium webkit
      - name: Install browsers
        # Browser downloads do not hold the apt lock, so bounded retries are safe.
        timeout-minutes: 10
        env:
          CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then exit 0; fi
          for attempt in 1 2 3; do
            timeout --signal=TERM --kill-after=15s 180s npx playwright install chromium webkit && exit 0
            echo "playwright browser download stalled (attempt $attempt); retrying"
          done
          exit 1
      # The E2E suite runs against the production server, so it needs a build first.
      - name: Build production application
        run: npm run build
      - name: Verify critical browser flows
        run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Security
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Scan tracked files and dependencies
        run: npm run check:security
