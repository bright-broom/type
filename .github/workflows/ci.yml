name: CI

# Feature-branch validation is intentionally explicit. A human starts Full CI
# once the pull request is ready to merge and supplies the exact head SHA.
# main still runs once after merge so Production is verified against its exact SHA.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-ci:
    name: Full CI
    runs-on: ubuntu-latest
    container:
      # The version-matched image contains Chromium, WebKit, and their OS
      # packages. A single runner avoids repeated checkout, install, and build.
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001 --ipc=host
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify the requested revision
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Requested $EXPECTED_SHA, but workflow_dispatch resolved to $ACTUAL_SHA."
            exit 1
          fi
          echo "Validating explicitly dispatched commit $ACTUAL_SHA."

      - name: Reject a direct push to main
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          for attempt in 1 2 3 4 5; do
            pulls="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/commits/${SHA}/pulls")"
            if node -e '
              const fs = require("node:fs");
              const pulls = JSON.parse(fs.readFileSync(0, "utf8"));
              const base = process.argv[1];
              process.exit(pulls.some((pull) => pull.merged_at && pull.base?.ref === base) ? 0 : 1);
            ' "${BASE_BRANCH}" <<<"${pulls}"; then
              echo "The main update is associated with a merged pull request."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Direct pushes to ${BASE_BRANCH} are prohibited. Submit a pull request and let a human owner merge it."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'src/**', 'public/**', 'next.config.*') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      - name: Verify peer ranges before installation
        run: npm run check:deps

      - name: Install dependencies
        run: npm ci

      - name: Run the complete local-equivalent gate
        env:
          TAKKEN_REVIEWER_KEYS_JSON: ${{ vars.TAKKEN_REVIEWER_KEYS_JSON }}
        run: npm run check:ci

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
