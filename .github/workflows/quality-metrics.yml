name: Quality metrics

on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Weekly engineering signals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Collect the last 28 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/collect-quality-metrics.mjs --repository "$GITHUB_REPOSITORY" --days 28 --output quality-metrics.md
      - name: Publish the job summary
        run: cat quality-metrics.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-metrics-${{ github.run_id }}
          path: quality-metrics.md
          retention-days: 90
