name: Codex CI advisory

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: codex-ci-advisory-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: true

jobs:
  classify:
    name: Prepare deterministic failure context
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout the trusted classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Download failed-job logs and classify them
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --attempt "$RUN_ATTEMPT" --log-failed > failure.log || true
          set +e
          node scripts/triage-ci-failure.mjs failure.log > triage.md
          status=$?
          set -e
          case "$status" in
            0) ;;
            2) echo "The deterministic classifier marked this failure as blocking." ;;
            *) echo "Classifier failed with status $status" >&2; exit "$status" ;;
          esac
      - name: Preserve the untrusted diagnostic context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-advisory-context-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: |
            failure.log
            triage.md
          retention-days: 14

  advise:
    name: Read-only Codex advisory
    needs: classify
    if: vars.CODEX_CI_ADVISORY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download the classified context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-advisory-context-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
      - name: Check whether the owner configured an API key
        id: api-key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Codex advisory is enabled, but OPENAI_API_KEY is not configured."
          fi
      - name: Produce a read-only advisory
        id: codex
        if: steps.api-key.outputs.available == 'true'
        uses: openai/codex-action@c385816875cc2fc8e033ed9d1cba96f8c331210e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          prompt-file: .github/codex/prompts/ci-advisory.md
          output-file: codex-ci-advisory.md
          codex-version: "0.148.0"
          codex-args: '["--ephemeral"]'
          safety-strategy: drop-sudo
      - name: Preserve the advisory for human review
        if: steps.codex.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-ci-advisory-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: codex-ci-advisory.md
          retention-days: 14
