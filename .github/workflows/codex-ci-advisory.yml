name: Codex CI advisory

# AI diagnosis is an explicit, read-only follow-up for a selected failed CI run.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed CI run ID to diagnose
        required: true
        type: string
      run_attempt:
        description: Run attempt number
        required: true
        default: "1"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: codex-ci-advisory-${{ inputs.run_id }}-${{ inputs.run_attempt }}
  cancel-in-progress: true

jobs:
  advise:
    name: Read-only Codex advisory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify the selected run is a failed CI run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ATTEMPT: ${{ inputs.run_attempt }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          if [ "$(jq -r '.name' <<<"$metadata")" != "CI" ]; then
            echo "::error::Run $RUN_ID is not a CI workflow run."
            exit 1
          fi
          if [ "$(jq -r '.path' <<<"$metadata")" != ".github/workflows/ci.yml" ]; then
            echo "::error::Run $RUN_ID does not belong to the trusted CI workflow path."
            exit 1
          fi
          if [ "$(jq -r '.conclusion' <<<"$metadata")" != "failure" ]; then
            echo "::error::Run $RUN_ID is not failed."
            exit 1
          fi
          if [ "$(jq -r '.run_attempt' <<<"$metadata")" != "$RUN_ATTEMPT" ]; then
            echo "::error::Run attempt does not match the selected CI evidence."
            exit 1
          fi

      - name: Checkout the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Download failed-job logs and classify them
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ATTEMPT: ${{ inputs.run_attempt }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --attempt "$RUN_ATTEMPT" \
            --log-failed > failure.log || true
          set +e
          node scripts/triage-ci-failure.mjs failure.log > triage.md
          status=$?
          set -e
          case "$status" in
            0) ;;
            2) echo "The deterministic classifier marked this failure as blocking." ;;
            *) echo "Classifier failed with status $status" >&2; exit "$status" ;;
          esac

      - name: Check whether the owner configured an API key
        id: api-key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured; preserving deterministic triage only."
          fi

      - name: Produce a read-only advisory
        id: codex
        if: steps.api-key.outputs.available == 'true'
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          prompt-file: .github/codex/prompts/ci-advisory.md
          output-file: codex-ci-advisory.md
          codex-version: "0.148.0"
          codex-args: '["--ephemeral"]'
          safety-strategy: drop-sudo

      - name: Preserve the minimized diagnostic context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-advisory-context-${{ inputs.run_id }}-${{ inputs.run_attempt }}
          path: triage.md
          retention-days: 14

      - name: Preserve the advisory for human review
        if: steps.codex.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-ci-advisory-${{ inputs.run_id }}-${{ inputs.run_attempt }}
          path: codex-ci-advisory.md
          retention-days: 14
