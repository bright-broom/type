name: CI triage

# Runs after CI finishes, in the base repository's context. `workflow_run` is used
# deliberately: it never checks out the pull request's code, so commenting on a
# fork or dependabot branch cannot execute anything from that branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ci-triage-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  triage:
    name: Explain the failure
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Checkout the base repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The triage classifier must come from the target branch, never from the
          # branch whose CI failed.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Classify the failed jobs
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > failure.log || true
          node scripts/triage-ci-failure.mjs failure.log > triage.md
          status=$?
          echo "blocking=$([ $status -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search "$HEAD_SHA" \
            --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "No open pull request for $HEAD_SHA; printing the triage instead."
            cat triage.md
            exit 0
          fi
          {
            cat triage.md
            echo
            echo "失敗した実行: $RUN_URL"
          } > comment.md
          gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body-file comment.md
      - name: Fail when the cause must not be merged
        if: steps.classify.outputs.blocking == 'true'
        run: |
          echo "::error::この失敗はマージ不可の分類です。詳細はPRコメントを参照してください。"
          exit 1
